name: Deploy EdgeOne

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgeone-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Images are stored in Git LFS. Cache the objects so a rebuild only
      # downloads assets that changed, then resolve pointers before building.
      - name: Resolve LFS cache key
        id: lfs
        run: echo "key=$(git lfs ls-files -l | cut -d' ' -f1 | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.key }}

      - name: Pull LFS assets
        run: git lfs pull

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build
        run: bash tools/build.sh --destination "$RUNNER_TEMP/site"

      - name: Test
        run: bash tools/test.sh "$RUNNER_TEMP/site"

      - name: Publish static branch
        env:
          DEPLOY_DIRECTORY: ${{ runner.temp }}/edgeone-pages
          SITE_DIRECTORY: ${{ runner.temp }}/site
          GITHUB_TOKEN: ${{ github.token }}
        # Commit on top of the existing branch instead of force-pushing an
        # orphan: only changed files are uploaded, and EdgeOne's Git
        # integration sees an ordinary push it can deploy from.
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch edgeone-pages "$remote" "$DEPLOY_DIRECTORY" 2>/dev/null; then
            find "$DEPLOY_DIRECTORY" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          else
            git init -q -b edgeone-pages "$DEPLOY_DIRECTORY"
            git -C "$DEPLOY_DIRECTORY" remote add origin "$remote"
          fi
          cp -a "$SITE_DIRECTORY/." "$DEPLOY_DIRECTORY/"
          cd "$DEPLOY_DIRECTORY"
          git add --all
          if git diff --cached --quiet; then
            echo "Site output unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Deploy $GITHUB_SHA"
          git push -q origin HEAD:edgeone-pages
